<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejemplo de embed</title>
</head>
<body>
  <!--
    Simula el HTML definition de PeopleSoft (HTML.MY_MAP_IFRAME).
    En PeopleSoft, MAP_URL es la URL publicada y `data` es %Bind(:1).
  -->
  <iframe id="colMap" src="./index.html" style="width:100%;height:600px;border:0"></iframe>
  <script>
    (function () {
      var MAP_URL = new URL("./index.html", location.href);
      var data = { "05001": 540, "11001": 1320, "76001": 410, "08001": 295, "13001": 120, "68001": 88, "52835": 12, "91001": 3 };
      var frame = document.getElementById("colMap");
      window.addEventListener("message", function (e) {
        if (e.origin !== MAP_URL.origin) return;
        if (e.data && e.data.type === "map-ready") {
          frame.contentWindow.postMessage(
            { type: "map-data", title: "Alumnos", values: data },
            MAP_URL.origin
          );
        }
      });
    })();
  </script>
</body>
</html>
