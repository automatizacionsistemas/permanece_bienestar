<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colombia por municipio</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap">
  <style>
    :root {
      color-scheme: light;
      --paper: #fffaf1;
      --ink: #1d1a16;
      --ink-soft: #5f584e;
      --ink-faint: #8d857a;
      --rule: rgba(29, 26, 22, 0.14);
      --shadow: 0 1px 2px rgba(29, 26, 22, 0.08), 0 8px 24px -6px rgba(29, 26, 22, 0.22);
      --display: "Fraunces", Georgia, serif;
      --body: "Hanken Grotesk", "Helvetica Neue", sans-serif;
    }
    html, body, #map { height: 100%; margin: 0; }
    body { background: #a9bfe0; color: var(--ink); font: 13px/1.4 var(--body); }
    .num { font-variant-numeric: lining-nums tabular-nums; }

    .card {
      position: absolute; background: var(--paper); border: 1px solid var(--rule);
      border-radius: 10px; box-shadow: var(--shadow);
      animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

    /* Level switch */
    .levels { top: 12px; left: 12px; display: flex; padding: 3px; gap: 2px; border-radius: 999px; }
    .levels button {
      padding: 6px 14px; border: 0; border-radius: 999px; cursor: pointer; background: transparent;
      font: 600 12px/1.3 var(--body); letter-spacing: 0.02em; color: var(--ink-soft);
      transition: background 0.18s, color 0.18s;
    }
    .levels button:hover { color: var(--ink); }
    .levels button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    .levels button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    /* Legend */
    .panel { left: 12px; bottom: 28px; width: 264px; padding: 12px 14px 12px; animation-delay: 0.08s; }
    .eyebrow {
      margin: 0 0 2px; font: 600 10px/1.3 var(--body); letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--ink-faint);
    }
    .panel h1 { margin: 0 0 10px; font: 600 17px/1.2 var(--display); letter-spacing: -0.01em; }
    .ramp { display: flex; gap: 2px; }
    .ramp span {
      flex: 1; height: 10px; border-radius: 2px; transform-origin: left;
      animation: grow 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }
    @keyframes grow { from { transform: scaleX(0); } }
    .ticks { display: flex; gap: 2px; margin-top: 4px; font-size: 10.5px; color: var(--ink-soft); }
    .ticks span { flex: 1; text-align: right; white-space: nowrap; }
    .nodata { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 11px; color: var(--ink-soft); }
    .nodata i { width: 12px; height: 10px; border-radius: 2px; border: 1px solid var(--rule); }
    #status { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--rule); color: var(--ink-soft); }
    #status b { font: 600 15px/1 var(--display); color: var(--ink); }

    /* Popup */
    .maplibregl-popup { animation: tip 0.14s ease-out both; }
    @keyframes tip { from { opacity: 0; } }
    .maplibregl-popup-tip { display: none; }
    .maplibregl-popup-content {
      min-width: 168px; padding: 0; overflow: hidden; pointer-events: none;
      background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
      box-shadow: var(--shadow); font: 13px/1.4 var(--body); color: var(--ink);
    }
    .tip-bar { height: 5px; }
    .tip-body { padding: 10px 14px 12px; }
    .tip-name { font: 600 16px/1.2 var(--display); letter-spacing: -0.01em; }
    .tip-sub { margin-top: 1px; font-size: 11px; color: var(--ink-faint); }
    .tip-value { margin-top: 10px; display: flex; align-items: baseline; gap: 6px; }
    .tip-value b { font: 600 30px/1 var(--display); letter-spacing: -0.02em; }
    .tip-value span { font-size: 12px; color: var(--ink-soft); }
    .tip-value.empty b { font-size: 15px; color: var(--ink-faint); letter-spacing: 0; }
    .tip-meta {
      margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--rule);
      display: flex; justify-content: space-between; gap: 16px; font-size: 11px; color: var(--ink-soft);
    }
    .tip-meta b { font-weight: 600; color: var(--ink); }

    /* Social links */
    .social { right: 12px; bottom: 46px; display: flex; gap: 2px; padding: 3px; border-radius: 999px; animation-delay: 0.12s; }
    .social a {
      display: grid; place-items: center; width: 30px; height: 30px; border-radius: 999px;
      color: var(--ink-soft); transition: background 0.18s, color 0.18s;
    }
    .social a:hover { background: var(--ink); color: var(--paper); }
    .social a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .social svg { width: 17px; height: 17px; }

    /* Map controls */
    .maplibregl-ctrl-group {
      background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
      box-shadow: var(--shadow) !important; overflow: hidden;
    }
    .maplibregl-ctrl-group button + button { border-top: 1px solid var(--rule); }
    .maplibregl-ctrl-attrib { font: 10px/1.4 var(--body); }

    @media (max-width: 520px) { .panel { width: 216px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="card levels" role="group" aria-label="Nivel del mapa">
    <button type="button" data-level="departamentos" aria-pressed="true">Departamentos</button>
    <button type="button" data-level="municipios" aria-pressed="false">Municipios</button>
  </div>
  <div class="card panel">
    <p class="eyebrow">Colombia</p>
    <h1 id="title">Registros por departamento</h1>
    <div id="legend"></div>
    <div id="status">Esperando datos…</div>
  </div>
  <nav class="card social" aria-label="Redes sociales">
    <a href="https://www.instagram.com/ced_coeurdepilote/" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
    </a>
  </nav>

  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
  <script>
    // Origins allowed to send data with postMessage. Empty = any origin.
    // Add the PeopleSoft domain here, e.g. "https://campus.example.edu.co".
    const ALLOWED_ORIGINS = [];

    const ATTRIBUTION = "DANE MGN 2025";
    // Sequential orange-red ramp, light -> dark
    const RAMP = ["#fef0d9", "#fdcc8a", "#fc8d59", "#e34a33", "#b30000"];
    const NO_DATA = "#e3e2de";
    const WATER = "#a9bfe0";
    const BORDER = "#ffffff";
    // Departamento labels below this zoom, municipio labels from it
    const MPIO_LABEL_ZOOM = 7;
    // Name, and the value under it when the place has data
    const LABEL_TEXT = ["case", ["has", "valueText"],
      ["format", ["get", "label"], {}, "\n", {},
        ["get", "valueText"], { "text-font": ["literal", ["Noto Sans Medium"]], "font-scale": 1.15 }],
      ["get", "label"]];
    // Places with higher values get their label first, then bigger areas
    const LABEL_ORDER = ["-", ["+", ["*", ["coalesce", ["get", "value"], 0], 100], ["get", "area"]]];
    // Mainland plus San Andrés y Providencia
    const BOUNDS = [[-81.8, -4.3], [-66.8, 13.5]];

    const tiles = (name) => "pmtiles://" + new URL(`tiles/${name}.pmtiles`, location.href).href;

    maplibregl.addProtocol("pmtiles", new pmtiles.Protocol().tile);

    const map = new maplibregl.Map({
      container: "map",
      bounds: BOUNDS,
      fitBoundsOptions: { padding: 20 },
      maxZoom: 14,
      attributionControl: { compact: true },
      style: {
        version: 8,
        glyphs: new URL("fonts/", location.href).href + "{fontstack}/{range}.pbf",
        sources: {
          labels: { type: "geojson", data: { type: "FeatureCollection", features: [] }, attribution: ATTRIBUTION },
          pais: { type: "vector", url: tiles("pais"), attribution: ATTRIBUTION },
          departamentos: {
            type: "vector", url: tiles("departamentos"), attribution: ATTRIBUTION,
            promoteId: { departamentos: "cod_dpto" },
          },
          municipios: {
            type: "vector", url: tiles("municipios"), attribution: ATTRIBUTION,
            promoteId: { municipios: "cod_mpio" },
          },
        },
        layers: [
          { id: "background", type: "background", paint: { "background-color": WATER } },
          {
            id: "municipios-fill", type: "fill", source: "municipios", "source-layer": "municipios",
            layout: { visibility: "none" },
            paint: { "fill-color": NO_DATA },
          },
          {
            id: "departamentos-fill", type: "fill", source: "departamentos", "source-layer": "departamentos",
            paint: { "fill-color": NO_DATA },
          },
          {
            id: "municipios-line", type: "line", source: "municipios", "source-layer": "municipios",
            layout: { visibility: "none" },
            paint: {
              "line-color": BORDER,
              "line-opacity": ["interpolate", ["linear"], ["zoom"], 4, 0.5, 7, 1],
              "line-width": ["interpolate", ["linear"], ["zoom"], 4, 0.2, 7, 0.6, 10, 1.2],
            },
          },
          {
            id: "municipios-hover", type: "line", source: "municipios", "source-layer": "municipios",
            paint: {
              "line-color": "#1a1a19",
              "line-width": ["case", ["boolean", ["feature-state", "hover"], false], 2, 0],
            },
          },
          {
            id: "departamentos-line", type: "line", source: "departamentos", "source-layer": "departamentos",
            layout: { "line-join": "round" },
            paint: {
              "line-color": BORDER,
              "line-width": ["interpolate", ["linear"], ["zoom"], 4, 1.2, 7, 2, 10, 3],
            },
          },
          {
            id: "departamentos-hover", type: "line", source: "departamentos", "source-layer": "departamentos",
            paint: {
              "line-color": "#1a1a19",
              "line-width": ["case", ["boolean", ["feature-state", "hover"], false], 2.5, 0],
            },
          },
          {
            id: "pais-line", type: "line", source: "pais", "source-layer": "pais",
            layout: { "line-join": "round" },
            paint: { "line-color": BORDER, "line-width": ["interpolate", ["linear"], ["zoom"], 4, 1.2, 10, 3] },
          },
          {
            id: "municipios-label", type: "symbol", source: "labels", minzoom: MPIO_LABEL_ZOOM,
            filter: ["==", ["get", "nivel"], "municipio"],
            layout: {
              visibility: "none",
              "text-field": LABEL_TEXT,
              "text-font": ["Noto Sans Regular"],
              "text-size": ["interpolate", ["linear"], ["zoom"], 7, 10, 11, 13],
              "text-max-width": 7,
              "text-padding": 4,
              "symbol-sort-key": LABEL_ORDER,
            },
            paint: { "text-color": "#1d1a16", "text-halo-color": "rgba(255,250,241,0.9)", "text-halo-width": 1.4 },
          },
          {
            id: "departamentos-label", type: "symbol", source: "labels",
            filter: ["==", ["get", "nivel"], "departamento"],
            layout: {
              "text-field": LABEL_TEXT,
              "text-font": ["Noto Sans Medium"],
              "text-size": ["interpolate", ["linear"], ["zoom"], 4, 10, 7, 14, 10, 18],
              "text-max-width": 8,
              "text-padding": 2,
              "symbol-sort-key": LABEL_ORDER,
            },
            paint: {
              "text-color": "#1d1a16",
              "text-halo-color": "rgba(255,250,241,0.9)",
              "text-halo-width": 1.6,
            },
          },
        ],
      },
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");

    const fmt = new Intl.NumberFormat("en-US"); // 1,320

    // One entry per map level. `values` is {code: count} for that level.
    const LEVELS = {
      departamentos: { one: "departamento", values: {}, painted: [], breaks: [], colors: [], total: 0, rank: {} },
      municipios: { one: "municipio", values: {}, painted: [], breaks: [], colors: [], total: 0, rank: {} },
    };
    // Departamento labels fade when municipio names show up
    const DPTO_LABEL_FADE = ["interpolate", ["linear"], ["zoom"], MPIO_LABEL_ZOOM, 1, MPIO_LABEL_ZOOM + 1, 0.45];
    let level = "departamentos";
    let baseTitle = "Registros";
    let pending = null;
    let ready = false;
    let received = false;

    // Quantile breaks: upper bound of each class, without repeats.
    function quantileBreaks(nums, classes) {
      const sorted = [...nums].sort((a, b) => a - b);
      const breaks = [];
      for (let i = 1; i <= classes; i++) {
        const v = sorted[Math.min(sorted.length - 1, Math.ceil((i * sorted.length) / classes) - 1)];
        if (breaks[breaks.length - 1] !== v) breaks.push(v);
      }
      return breaks;
    }

    const node = (tag, className, text) => {
      const n = document.createElement(tag);
      if (className) n.className = className;
      if (text !== undefined) n.textContent = text;
      return n;
    };

    // Stepped color bar; the number under each step is its upper bound
    function renderLegend(breaks, colors) {
      const ramp = node("div", "ramp");
      const ticks = node("div", "ticks num");
      breaks.forEach((to, i) => {
        const step = node("span");
        step.style.background = colors[i];
        step.style.animationDelay = `${i * 50}ms`;
        ramp.append(step);
        ticks.append(node("span", "", fmt.format(to)));
      });
      const none = node("div", "nodata");
      const chip = node("i");
      chip.style.background = NO_DATA;
      none.append(chip, "Sin datos");
      document.getElementById("legend").replaceChildren(ramp, ticks, none);
    }

    function setValues(name, data) {
      const lv = LEVELS[name];
      for (const id of lv.painted) map.removeFeatureState({ source: name, sourceLayer: name, id }, "value");
      lv.values = data;
      lv.painted = Object.keys(data);
      for (const id of lv.painted) map.setFeatureState({ source: name, sourceLayer: name, id }, { value: data[id] });

      const withData = lv.painted.filter((id) => data[id] > 0).sort((a, b) => data[b] - data[a]);
      lv.total = withData.reduce((sum, id) => sum + data[id], 0);
      lv.rank = {};
      withData.forEach((id, i) => { lv.rank[id] = i + 1; });
      lv.count = withData.length;
      const nums = withData.map((id) => data[id]);
      lv.breaks = nums.length ? quantileBreaks(nums, RAMP.length) : [];
      // With fewer classes than colors, keep the dark end of the ramp
      lv.colors = RAMP.slice(RAMP.length - lv.breaks.length);
    }

    function colorOf(lv, value) {
      if (!(value > 0)) return NO_DATA;
      const i = lv.breaks.findIndex((to) => value <= to);
      return lv.colors[i === -1 ? lv.colors.length - 1 : i];
    }

    function setStatus(number, text) {
      const status = document.getElementById("status");
      if (number === null) status.replaceChildren(text);
      else status.replaceChildren(node("b", "num", number), ` ${text}`);
    }

    // The name and value of each place, shown on the map
    let labelData = null;
    function updateLabels() {
      if (!labelData) return;
      for (const f of labelData.features) {
        const lv = LEVELS[f.properties.nivel === "municipio" ? "municipios" : "departamentos"];
        const value = lv.values[f.properties.codigo];
        if (value > 0) {
          f.properties.value = value;
          f.properties.valueText = fmt.format(value);
        } else {
          delete f.properties.value;
          delete f.properties.valueText;
        }
      }
      map.getSource("labels").setData(labelData);
    }

    // Colors, legend and totals for the active level
    function render() {
      const lv = LEVELS[level];
      document.getElementById("title").textContent = `${baseTitle} por ${lv.one}`;
      if (!lv.breaks.length) {
        map.setPaintProperty(`${level}-fill`, "fill-color", NO_DATA);
        document.getElementById("legend").replaceChildren();
        setStatus(null, received ? "Sin datos" : "Esperando datos…");
        return;
      }

      const step = ["step", ["feature-state", "value"], lv.colors[0]];
      for (let i = 1; i < lv.breaks.length; i++) step.push(lv.breaks[i - 1] + 1, lv.colors[i]);
      map.setPaintProperty(`${level}-fill`, "fill-color", [
        "case", [">", ["coalesce", ["feature-state", "value"], 0], 0], step, NO_DATA,
      ]);
      renderLegend(lv.breaks, lv.colors);
      setStatus(fmt.format(lv.total), `${unit()} en ${fmt.format(lv.count)} ${lv.count === 1 ? lv.one : level}`);
    }

    // "Alumnos" -> "alumnos", used next to the numbers
    const unit = () => baseTitle.toLowerCase();

    function setLevel(name) {
      level = name;
      const mpios = name === "municipios";
      const show = (id, on) => map.setLayoutProperty(id, "visibility", on ? "visible" : "none");
      show("departamentos-fill", !mpios);
      show("municipios-fill", mpios);
      show("municipios-line", mpios);
      show("municipios-label", mpios);
      map.setPaintProperty("departamentos-label", "text-opacity", mpios ? DPTO_LABEL_FADE : 1);
      for (const b of document.querySelectorAll(".levels button")) {
        b.setAttribute("aria-pressed", String(b.dataset.level === name));
      }
      clearHover();
      render();
    }

    function paint(mpios, dptos, title) {
      received = true;
      if (title) baseTitle = title;
      // Without departamento values, add up the municipios: the first 2 digits are the departamento
      if (!dptos) {
        dptos = {};
        for (const [code, n] of Object.entries(mpios)) dptos[code.slice(0, 2)] = (dptos[code.slice(0, 2)] || 0) + n;
      }
      setValues("municipios", mpios);
      setValues("departamentos", dptos);
      updateLabels();
      render();
    }

    // Accepts {"05001": 120, ...}. Drops keys that are not DANE codes of `digits` length.
    function clean(raw, digits) {
      const out = {};
      if (!raw || typeof raw !== "object") return out;
      const valid = new RegExp(`^\\d{${digits}}$`);
      for (const [k, v] of Object.entries(raw)) {
        const code = String(k).padStart(digits, "0");
        const n = Number(v);
        if (valid.test(code) && Number.isFinite(n)) out[code] = n;
      }
      return out;
    }

    // Message: {type: "map-data", title, values: {cod_mpio: n}, departamentos: {cod_dpto: n}}
    // `departamentos` is optional; send it when the values cannot be added up (averages, rates).
    window.addEventListener("message", (e) => {
      if (ALLOWED_ORIGINS.length && !ALLOWED_ORIGINS.includes(e.origin)) return;
      if (!e.data || e.data.type !== "map-data") return;
      const title = typeof e.data.title === "string" ? e.data.title : null;
      const args = [clean(e.data.values, 5), e.data.departamentos ? clean(e.data.departamentos, 2) : null, title];
      if (ready) paint(...args);
      else pending = args;
    });

    for (const b of document.querySelectorAll(".levels button")) {
      b.addEventListener("click", () => { if (ready) setLevel(b.dataset.level); });
    }

    // "SAN ANDRÉS DE TUMACO" -> "San Andrés de Tumaco"
    function labelCase(name) {
      const small = new Set(["de", "del", "la", "las", "los", "el", "y"]);
      return String(name).toLowerCase().split(" ")
        .map((w, i) => (i && small.has(w) ? w : w.charAt(0).toUpperCase() + w.slice(1)))
        .join(" ");
    }

    const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 14, maxWidth: "260px" });
    let hover = null; // {source, id}

    function clearHover() {
      if (hover) map.setFeatureState({ source: hover.source, sourceLayer: hover.source, id: hover.id }, { hover: false });
      hover = null;
      map.getCanvas().style.cursor = "";
      popup.remove();
    }

    for (const name of Object.keys(LEVELS)) {
      map.on("mousemove", `${name}-fill`, (e) => {
        const f = e.features[0];
        if (!hover || hover.source !== name || hover.id !== f.id) {
          clearHover();
          hover = { source: name, id: f.id };
          map.setFeatureState({ source: name, sourceLayer: name, id: f.id }, { hover: true });
        }
        map.getCanvas().style.cursor = "pointer";

        const lv = LEVELS[name];
        const value = lv.values[f.id];
        const has = value > 0;

        const bar = node("div", "tip-bar");
        bar.style.background = colorOf(lv, value);
        const body = node("div", "tip-body");
        const sub = name === "municipios" ? `${labelCase(f.properties.dpto)} · ${f.id}` : `Departamento · ${f.id}`;
        const amount = node("div", has ? "tip-value" : "tip-value empty");
        amount.append(node("b", "num", has ? fmt.format(value) : "Sin datos"));
        if (has) amount.append(node("span", "", unit()));
        body.append(node("div", "tip-name", labelCase(f.properties.nombre)), node("div", "tip-sub num", sub), amount);
        if (has) {
          const share = (value / lv.total) * 100;
          const meta = node("div", "tip-meta num");
          const left = node("span");
          left.append(node("b", "", `${share < 0.1 ? "<0.1" : share.toFixed(1)}%`), " del total");
          const right = node("span");
          right.append("Puesto ", node("b", "", `${lv.rank[f.id]}`), ` de ${fmt.format(lv.count)}`);
          meta.append(left, right);
          body.append(meta);
        }
        const box = node("div");
        box.append(bar, body);
        popup.setLngLat(e.lngLat).setDOMContent(box).addTo(map);
      });
      map.on("mouseleave", `${name}-fill`, clearHover);
    }

    // An iframe can report a wrong size at startup, so refit until the user moves the map
    let userMoved = false;
    const fit = () => { if (!userMoved) map.fitBounds(BOUNDS, { padding: 20, animate: false }); };
    map.on("movestart", (e) => { if (e.originalEvent) userMoved = true; });
    map.on("resize", fit);

    map.on("load", () => {
      ready = true;
      fit();
      fetch(new URL("tiles/labels.geojson", location.href))
        .then((r) => r.json())
        .then((json) => { labelData = json; updateLabels(); });
      if (pending) paint(...pending);
      pending = null;
      // Tell the host page the map can receive data
      if (window.parent !== window) window.parent.postMessage({ type: "map-ready" }, "*");
    });
  </script>
</body>
</html>
